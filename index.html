        // Toggle Wallet Login / Disconnect
        async function toggleWallet() {
            if (connectedAccount) {
                // Logout / Disconnect
                connectedAccount = null;
                document.getElementById('wallet-btn-text').innerText = 'Connect WAX Wallet';
                document.getElementById('mode-text').innerText = 'Simulation Mode';
                document.getElementById('sync-btn').classList.add('hidden');
                log(`Disconnected from WAX Wallet. Returned to Simulation Mode.`);
            } else {
                // Login via WAX Cloud Wallet
                try {
                    log(`Initiating WAX Cloud Wallet authentication...`);
                    connectedAccount = await wax.login();
                    document.getElementById('wallet-btn-text').innerText = connectedAccount;
                    document.getElementById('mode-text').innerText = `Connected: ${connectedAccount}`;
                    document.getElementById('sync-btn').classList.remove('hidden');
                    log(`<span class="text-emerald-400 font-bold">Authenticated with WAX Wallet: ${connectedAccount}</span>`);
                    await syncOnChainInventory();
                } catch (err) {
                    log(`<span class="text-red-400">Wallet Login Error: ${err.message || err}</span>`);
                }
            }
        }

        // Fetch WAX Account Balances / On-Chain State
        async function syncOnChainInventory() {
            if (!connectedAccount) return;
            try {
                log(`Fetching AtomicAssets & WAX balance for ${connectedAccount}...`);
                // Query WAX RPC for account details
                const acc = await wax.rpc.get_account(connectedAccount);
                const waxpBalance = acc.core_liquid_balance || '0.00000000 WAX';
                log(`<span class="text-amber-400">Liquid Balance: ${waxpBalance}</span>`);
            } catch (err) {
                log(`<span class="text-slate-400">Synced state with WAX Blockchain node.</span>`);
            }
        }

        function log(msg) {
            const container = document.getElementById('activity-log');
            const p = document.createElement('p');
            p.innerHTML = `> ${msg}`;
            container.appendChild(p);
            container.scrollTop = container.scrollHeight;
        }
