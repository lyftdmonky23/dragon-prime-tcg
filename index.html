<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Prime: Fusion TCG — Simulator & dApp</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wax: {
                            gold: '#f5a623',
                            dark: '#0f172a',
                            card: '#1e293b',
                            accent: '#3b82f6',
                            bronze: '#cd7f32',
                            silver: '#c0c0c0',
                            platinum: '#e5e4e2'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glow-gold { filter: drop-shadow(0 0 10px rgba(245, 166, 35, 0.4)); }
        .glow-platinum { filter: drop-shadow(0 0 12px rgba(229, 228, 226, 0.6)); }
        .card-gradient { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-amber-500 selection:text-slate-950">

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🐉</span>
                <span class="font-extrabold text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-orange-500 to-amber-200">
                    DRAGON PRIME: FUSION
                </span>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-xs bg-amber-500/10 text-amber-400 px-3 py-1 rounded-full border border-amber-500/20 font-semibold">
                    WAX Blockchain Simulator
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-10">

        <!-- Banner / Hero Section -->
        <section class="rounded-2xl bg-gradient-to-r from-amber-950/40 via-slate-900 to-slate-900 border border-amber-500/20 p-6 md:p-8 relative overflow-hidden">
            <div class="relative z-10 max-w-3xl space-y-3">
                <h1 class="text-3xl md:text-4xl font-extrabold text-amber-400">Gather Essence. Fuse Eggs. Claim Prime Glory.</h1>
                <p class="text-slate-300 text-sm md:text-base leading-relaxed">
                    Welcome to the official simulator for <strong>Dragon Prime: Fusion TCG</strong>. Burn Mysterious Dragon Essence to reveal metallic eggs, and fuse matching tiers to hatch powerful Dragon Wyrms!
                </p>
            </div>
        </section>

        <!-- Main Dashboard: Inventory & Simulator -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Inventory Panel -->
            <div class="lg:col-span-1 bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6">
                <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                    <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-boxes-stacked text-amber-400"></i> Vault Inventory
                    </h2>
                    <button onclick="resetInventory()" class="text-xs text-slate-400 hover:text-red-400 transition">Reset</button>
                </div>

                <div id="inventory-list" class="space-y-3">
                    <!-- Populated dynamically via JS -->
                </div>

                <div class="pt-2">
                    <button onclick="mintEssence(10)" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl shadow-lg shadow-amber-500/10 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-vial-circle-check"></i> Mint +
